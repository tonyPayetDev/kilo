services:
  claude-code:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Lancer code-server directement : l'entrypoint de l'image passe par fixuid,
    # qui ne fonctionne pas avec USER coder ni no-new-privileges.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - test -n "$$PASSWORD" || { echo 'PASSWORD manquant' >&2; exit 1; }; exec code-server --auth password --bind-addr 0.0.0.0:8080 /home/coder/project
    environment:
      PASSWORD: ${PASSWORD:?Set a strong PASSWORD in Coolify}
    expose:
      - "8080"
    volumes:
      - claude-project-v2:/home/coder/project
      - claude-state-v2:/home/coder/.claude
      - claude-config-v2:/home/coder/.config
      - claude-local-v2:/home/coder/.local
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  claude-project-v2:
  claude-state-v2:
  claude-config-v2:
  claude-local-v2:
